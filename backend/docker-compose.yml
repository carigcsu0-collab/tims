services:
  tims_backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tims-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8060}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_NAME=TIMS
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:?Set APP_KEY in the stack environment}
      - APP_URL=${APP_URL:?Set APP_URL in the stack environment}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Manila}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-tims}
      - DB_USERNAME=${DB_USERNAME:?Set DB_USERNAME in the stack environment}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the stack environment}
      - SESSION_DRIVER=database
      - SESSION_SECURE_COOKIE=true
      - CACHE_STORE=database
      - QUEUE_CONNECTION=sync
    volumes:
      - api-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  api-storage:
