name: tims
description: "TVET Inventory Management System - TESDA-accredited Training Centers and Assessment Centers"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.3

  # Models / Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  logger: ^2.5.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  data_table_2: ^2.5.16
  flutter_staggered_grid_view: ^0.7.0

  # Files / Export
  file_picker: ^8.1.6
  pdf: ^3.11.2
  printing: ^5.13.4

  # Connectivity
  connectivity_plus: ^6.1.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Environment
  flutter_dotenv: ^5.2.1

  # Functional Programming
  dartz: ^0.10.1

  # Form validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.1

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
